<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>사과게임</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
}

.hidden { display: none; }

/* 정보 */
#info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 10px 0;
  font-weight: bold;
}

/* 보드 */
#board {
  width: 80vw;
  max-width: 360px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  touch-action: none;
  user-select: none;
}

/* 사과 */
.cell {
  aspect-ratio: 1 / 1;
  background: radial-gradient(circle at 30% 30%, #ffe3e3, #ff6b6b);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: #fff;
  text-shadow: 0 0 3px rgba(0,0,0,0.9);
}

.cell.empty {
  background: #e0e0e0;
  border-radius: 6px;
  color: transparent;
}

.selected { outline: 3px solid #ffd43b; }

/* 터짐 */
@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  60% { transform: scale(1.35); }
  100% { transform: scale(0); opacity: 0; }
}
.pop { animation: pop 0.3s ease-out forwards; }

/* 랭킹 */
#ranking {
  max-width: 320px;
  margin: 10px auto 20px;
  padding: 0;
}
#ranking li {
  list-style: none;
  margin: 4px 0;
  padding: 6px;
  border-radius: 6px;
}
.rank1 { background: gold; font-weight: bold; }
.rank2 { background: silver; font-weight: bold; }
.rank3 { background: #cd7f32; font-weight: bold; }
.rankN { background: #fff3cd; }

button {
  padding: 10px 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2 id="icon" style="cursor:pointer">🍎 사과게임</h2>

<div id="mainScreen">
  <button id="startBtn">▶ 게임 시작</button>
  <h3 id="rankingTitle"></h3>
  <ol id="ranking"></ol>
</div>

<div id="gameScreen" class="hidden">
  <div id="info">
    <div id="score">점수: 0</div>
    <div id="timer">02:00</div>
  </div>
  <div id="board"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  query, where, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyCJUkB5D5Fm35Sgyd7gw9sLInL4toKArMg",
  authDomain: "applegame-32c01.firebaseapp.com",
  projectId: "applegame-32c01",
  storageBucket: "applegame-32c01.firebasestorage.app",
  messagingSenderId: "471752911086",
  appId: "1:471752911086:web:6ea47c3952412fe650ebff"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 설정 */
const ROWS = 12;
const COLS = 10;
const GAME_TIME = 120;

/* 상태 */
let board = [];
let cells = [];
let visited = [];
let selecting = false;
let score = 0;
let timeLeft = GAME_TIME;
let timerId = null;
let gameOver = true;
let infiniteMode = false;

/* DOM */
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const rankingEl = document.getElementById("ranking");
const rankingTitleEl = document.getElementById("rankingTitle");
const mainScreen = document.getElementById("mainScreen");
const gameScreen = document.getElementById("gameScreen");

/* 월 */
function getCurrentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function updateRankingTitle(m) {
  const [y, mo] = m.split("-");
  rankingTitleEl.textContent = `📅 ${y}년 ${Number(mo)}월 랭킹 TOP 30`;
}

/* 화면 */
function showMain() {
  mainScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  loadRanking();
}
function showGame() {
  mainScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
}

/* 보드 */
function initBoard() {
  board = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => Math.floor(Math.random() * 9) + 1)
  );
}
function render() {
  boardEl.innerHTML = "";
  cells = [];
  board.forEach((row, r) => {
    row.forEach((v, c) => {
      const d = document.createElement("div");
      d.className = "cell" + (v === 0 ? " empty" : "");
      d.textContent = v || "";
      d.dataset.r = r;
      d.dataset.c = c;
      boardEl.appendChild(d);
      cells.push(d);
    });
  });
}

/* 10 가능 여부 */
function canMakeTen() {
  for (let r1=0;r1<ROWS;r1++)
    for (let c1=0;c1<COLS;c1++)
      for (let r2=r1;r2<ROWS;r2++)
        for (let c2=c1;c2<COLS;c2++) {
          let sum=0,count=0;
          for (let r=r1;r<=r2;r++)
            for (let c=c1;c<=c2;c++)
              if (board[r][c]>0) {
                sum+=board[r][c];
                count++;
              }
          if (sum===10 && count>=2) return true;
        }
  return false;
}

/* 타이머 */
function startTimer() {
  clearInterval(timerId);
  if (infiniteMode) {
    timerEl.textContent = "∞";
    return;
  }
  timerId = setInterval(() => {
    timeLeft--;
    timerEl.textContent =
      `${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;
    if (timeLeft<=0) endGame();
  },1000);
}

/* 드래그 */
boardEl.onpointerdown = () => {
  if (gameOver) return;
  visited=[]; selecting=true;
};
boardEl.onpointermove = e => {
  if (!selecting) return;
  const el = document.elementFromPoint(e.clientX,e.clientY);
  if (!el || !el.classList.contains("cell")) return;
  const r=+el.dataset.r,c=+el.dataset.c;
  if (visited.some(v=>v[0]===r&&v[1]===c)) return;
  visited.push([r,c]);
};
boardEl.onpointerup = () => {
  selecting=false;
  if (!visited.length) return;

  const rs=visited.map(v=>v[0]), cs=visited.map(v=>v[1]);
  const minR=Math.min(...rs), maxR=Math.max(...rs);
  const minC=Math.min(...cs), maxC=Math.max(...cs);

  let sum=0,pos=[];
  for (let r=minR;r<=maxR;r++)
    for (let c=minC;c<=maxC;c++)
      if (board[r][c]>0){ sum+=board[r][c]; pos.push([r,c]); }

  if (sum===10 && pos.length>=2){
    pos.forEach(([r,c])=>board[r][c]=0);
    score+=pos.length;
    scoreEl.textContent=`점수: ${score}`;
    render();

    if (!infiniteMode && !canMakeTen()) {
      alert("❌ 더 이상 10을 만들 수 없습니다!");
      endGame();
    }
  }
};

/* 랭킹 저장 */
async function saveOnline(name, score) {
  await addDoc(collection(db,"ranking"), {
    name,
    score,
    month: getCurrentMonth(),
    date: new Date()
  });
}

/* 랭킹 불러오기 */
async function loadRanking() {
  const m = getCurrentMonth();
  updateRankingTitle(m);

  const q = query(
    collection(db,"ranking"),
    where("month","==",m),
    orderBy("score","desc"),
    limit(30)
  );

  const snap = await getDocs(q);
  rankingEl.innerHTML="";
  let rank=1;
  snap.forEach(doc=>{
    const d=doc.data();
    const li=document.createElement("li");
    li.className =
      rank===1?"rank1":
      rank===2?"rank2":
      rank===3?"rank3":"rankN";
    li.textContent=`${rank}위 · ${d.name} · ${d.score}점`;
    rankingEl.appendChild(li);
    rank++;
  });
}

/* 종료 */
async function endGame() {
  gameOver=true;
  clearInterval(timerId);

  const name = prompt("닉네임 입력") || "PLAYER";
  await saveOnline(name.slice(0,10), score);

  showMain();
}

/* 시작 버튼 (제한) */
document.getElementById("startBtn").onclick = () => {
  infiniteMode=false;
  score=0; timeLeft=GAME_TIME; gameOver=false;
  scoreEl.textContent="점수: 0";
  initBoard(); render(); showGame(); startTimer();
};

/* 아이콘 (무제한) */
document.getElementById("icon").onclick = () => {
  infiniteMode=true;
  score=0; gameOver=false;
  scoreEl.textContent="점수: 0";
  initBoard(); render(); showGame(); startTimer();
};

showMain();
</script>
</body>
</html>
