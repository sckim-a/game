<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>사과게임</title>
<link rel="icon" href="favicon.ico">
<style>
body{margin:0;font-family:Arial,sans-serif;text-align:center;}
.hidden{display:none;}
#title{cursor:pointer;user-select:none;}
#info{display:flex;justify-content:center;gap:20px;margin:10px 0;font-weight:bold;}
#board{
  width:80vw;max-width:360px;margin:auto;
  display:grid;grid-template-columns:repeat(10,1fr);
  gap:4px;touch-action:none;user-select:none;
}
.cell{
  aspect-ratio:1/1;border-radius:50%;
  background: radial-gradient(
    circle at 30% 30%,
    #ffd6d6,
    #e85a5a
  );
  box-shadow: inset 0 0 0 3px #e44;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:24px;color:#fffaf0;
}
.cell.empty{background:#ddd;color:transparent;border-radius:6px;}
.selected{outline:3px solid rgba(120,200,180,0.9);}
@keyframes pop{
  0%   { transform: scale(1) rotate(0deg); opacity: 1; }
  50%  { transform: scale(1.5) rotate(15deg); opacity: 1; }
  100% { transform: scale(0) rotate(45deg); opacity: 0; }
}
.pop{animation: pop 0.4s forwards;}
#toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.8);color:#fff;
  padding:14px 20px;border-radius:10px;
  opacity:0;transition:.3s;pointer-events:none;z-index:100;
}
#toast.show{opacity:1;}
#ranking{max-width:320px;margin:10px auto;text-align:left;padding:0;}
#ranking li{list-style:none;margin:4px 0;padding:6px;border-radius:6px;font-size:14px;}
#resultModal{
  position: fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background: rgba(0,0,0,0.85); color:#fff; padding:20px;
  border-radius:10px; z-index:1000;
}
</style>
</head>
<body>

<h2 id="title">🍎 사과게임</h2>

<div id="mainScreen">
  <div style="margin:8px 0;">
    닉네임 :
    <input id="nicknameInput" maxlength="10" placeholder="닉네임 입력">
    <button id="saveNickBtn">저장</button>
  </div>
  <button id="startBtn">▶ 시작</button>

  <h3 id="rankingTitle"></h3>
  <ol id="ranking"></ol>
</div>

<div id="gameScreen" class="hidden">
  <div id="info">
    <div id="score">점수: 0</div>
    <div id="timer">02:30</div>
  </div>
  <div id="board"></div>
</div>

<div id="toast"></div>

<div id="resultModal" class="hidden">
  <div id="finalScoreText"></div>
  <button id="confirmResultBtn">확인</button>
</div>

<script type="module">
/* ===================== Firebase ===================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCJUkB5D5Fm35Sgyd7gw9sLInL4toKArMg",
  authDomain:"applegame-32c01.firebaseapp.com",
  projectId:"applegame-32c01"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===================== 설정 ===================== */
const ROWS=12, COLS=10, GAME_TIME=150;

/* ===================== 상태 ===================== */
let board=[], cells=[], visited=[];
let selecting=false, score=0;
let timeLeft = GAME_TIME;
let timerId=null;
let gameStarted=false, gameOver=true;
let startPos = null;
let endPos = null;
  
/* 히든모드 */
let hiddenMode=false;
let pressTimer=null;

/* ===================== DOM ===================== */
const boardEl=document.getElementById("board");
const scoreEl=document.getElementById("score");
const timerEl=document.getElementById("timer");
const toastEl=document.getElementById("toast");
const mainScreen=document.getElementById("mainScreen");
const gameScreen=document.getElementById("gameScreen");
const nickInput=document.getElementById("nicknameInput");
const resultModal=document.getElementById("resultModal");
const finalScoreText=document.getElementById("finalScoreText");
const rankingEl=document.getElementById("ranking");
const rankingTitleEl=document.getElementById("rankingTitle");

/* ===================== 사운드 ===================== */
const popSound = new Audio("pop.wav");
const endSound = new Audio("end.wav");
[popSound,endSound].forEach(s=>{s.preload="auto";s.volume=0.6;});

/* ===================== 닉네임 ===================== */
function loadNick(){const n=localStorage.getItem("apple_nick");if(n) nickInput.value=n;}
function saveNick(){const n=nickInput.value.trim();if(!n) return alert("닉네임 입력"); localStorage.setItem("apple_nick",n);}
function getNick(){return localStorage.getItem("apple_nick")||"";}
document.getElementById("saveNickBtn").onclick=saveNick;
loadNick();

/* ===================== 토스트 ===================== */
function showToast(msg){toastEl.textContent=msg; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"),1000);}

/* ===================== 히든모드 ===================== */
const titleEl=document.getElementById("title");
titleEl.onpointerdown=()=>{
  pressTimer=setTimeout(()=>{
    if(getNick()!=="sc") return;
    hiddenMode=!hiddenMode;
    showToast(hiddenMode?"🍏 히든모드 ON":"🍎 히든모드 OFF");
  },1500);
};
titleEl.onpointerup=titleEl.onpointerleave=()=>clearTimeout(pressTimer);

/* ===================== 보드 ===================== */
function initBoard(){
  board=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>Math.floor(Math.random()*9)+1));
}
function render(){
  boardEl.innerHTML=""; cells=[];
  board.forEach((r,i)=>r.forEach((v,j)=>{
    const d=document.createElement("div");
    d.className="cell"+(v===0?" empty":"");
    d.textContent=v||"";
    d.dataset.r=i; d.dataset.c=j;
    boardEl.appendChild(d);
    cells.push(d);
  }));
}

/* ===================== 타이머 ===================== */
function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!gameStarted) return;
    timeLeft--;
    timerEl.textContent=
      `${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;
    if(timeLeft<=0) endGame();
  },1000);
}

function clearSelection(){
  cells.forEach(c=>c.classList.remove("selected"));
}

function highlightSelection(r1, r2, c1, c2){
  clearSelection();
  for(let r=r1; r<=r2; r++){
    for(let c=c1; c<=c2; c++){
      cells[r*COLS + c].classList.add("selected");
    }
  }
}
  
/* ===================== 선택 & 점수 ===================== */
boardEl.onpointerdown = e => {
  if(gameOver) return;

  const el = e.target;
  if(!el.classList.contains("cell")) return;

  e.preventDefault(); // ★ 중요
  boardEl.setPointerCapture(e.pointerId); // ★ 핵심

  selecting = true;
  startPos = [+el.dataset.r, +el.dataset.c];
  endPos = startPos;
};

boardEl.onpointermove = e => {
  if(!selecting) return;

  const el = document.elementFromPoint(e.clientX, e.clientY);
  if(!el || !el.classList.contains("cell")) return;

  endPos = [+el.dataset.r, +el.dataset.c];

  const r1 = Math.min(startPos[0], endPos[0]);
  const r2 = Math.max(startPos[0], endPos[0]);
  const c1 = Math.min(startPos[1], endPos[1]);
  const c2 = Math.max(startPos[1], endPos[1]);

  highlightSelection(r1, r2, c1, c2);
};

boardEl.onpointerup = e => {
  if(!selecting) return;

  selecting = false;
  boardEl.releasePointerCapture(e.pointerId); // ★ 필수

  if(!startPos || !endPos) return;

  const r1 = Math.min(startPos[0], endPos[0]);
  const r2 = Math.max(startPos[0], endPos[0]);
  const c1 = Math.min(startPos[1], endPos[1]);
  const c2 = Math.max(startPos[1], endPos[1]);

  let sum = 0, appleCount = 0, pos = [];

  for(let r=r1;r<=r2;r++){
    for(let c=c1;c<=c2;c++){
      if(board[r][c] > 0){
        sum += board[r][c];
        appleCount++;
        pos.push([r,c]);
      }
    }
  }

  if(sum === 10 && appleCount >= 2){
    popSound.currentTime = 0;
    popSound.play();

    pos.forEach(([r,c])=>{
      cells[r*COLS+c].classList.add("pop");
    });

    setTimeout(()=>{
      pos.forEach(([r,c])=>board[r][c]=0);
      score += appleCount;
      scoreEl.textContent = `점수: ${score}`;
      render();
    },400);
  }

  startPos = endPos = null;
  clearSelection(); // ★ 선택 표시 제거
};

/* ===================== 랭킹 ===================== */
function getWeek(){
  const d=new Date();
  const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=u.getUTCDay()||7;
  u.setUTCDate(u.getUTCDate()+4-day);
  const y=new Date(Date.UTC(u.getUTCFullYear(),0,1));
  const w=Math.ceil((((u-y)/86400000)+1)/7);
  return `${u.getUTCFullYear()}-W${String(w).padStart(2,"0")}`;
}

async function saveRank(score){
  await addDoc(collection(db,"ranking"),{
    name:getNick(),
    score,
    week:getWeek(),
    date:new Date()
  });
}

async function loadRanking(){
  const w = getWeek();
  rankingTitleEl.textContent = `📅 ${w} 주간 랭킹`;
  rankingEl.innerHTML = "";

  const q = query(
    collection(db,"ranking"),
    where("week","==",w),
    orderBy("score","desc"),
    limit(50)
  );

  const snap = await getDocs(q);
  let i = 1;
  snap.forEach(d=>{
    const li = document.createElement("li");
    li.textContent = `${i}위 · ${d.data().name} · ${d.data().score}`;

    // 1,2,3위 강조
    if(i===1) li.style.background="gold";
    else if(i===2) li.style.background="silver";
    else if(i===3) li.style.background="#cd7f32";
    else li.style.background="#fff3cd";

    li.style.fontWeight = i<=3?"bold":"normal";
    li.style.padding="6px";
    li.style.margin="4px 0";
    li.style.borderRadius="6px";

    rankingEl.appendChild(li);
    i++;
  });
}

/* ===================== 게임 종료 ===================== */
async function endGame(){
  if(gameOver) return;
  gameOver=true; gameStarted=false;
  clearInterval(timerId);
  endSound.currentTime=0; endSound.play();
  await saveRank(score);
  finalScoreText.textContent=`내 점수: ${score}점`;
  resultModal.classList.remove("hidden");
}

document.getElementById("confirmResultBtn").onclick=()=>{
  resultModal.classList.add("hidden");
  mainScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  loadRanking();
};

/* ===================== 게임 시작 ===================== */
document.getElementById("startBtn").onclick=()=>{
  if(!getNick()) return alert("닉네임 입력");
  score=0;
  scoreEl.textContent="점수: 0";
  timeLeft = hiddenMode?210:GAME_TIME;
  timerEl.textContent=
    `${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;
  gameOver=false; gameStarted=true;
  initBoard(); render();
  mainScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  startTimer();
};

/* ===================== 초기 화면 ===================== */
loadRanking();
</script>
</body>
</html>
