<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>사과게임</title>
<link rel="icon" href="favicon.ico">
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fffdf8;
  color:#333;
}

.hidden{display:none;}
#title{cursor:pointer;user-select:none;}

#info{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:10px 0;
  font-weight:bold;
}

#board{
  width:80vw;
  max-width:360px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;
  touch-action:none;
  user-select:none;
}

.cell{
  aspect-ratio:1/1;
  border-radius:50%;
  background: radial-gradient(
    circle at 30% 30%,
    #ffd6d6,
    #e85a5a
  );
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:24px;
  color:#fffaf0;
}

.cell.empty{
  background:#ddd;
  color:transparent;
  border-radius:6px;
}

.selected{
  outline:3px solid rgba(120,200,180,0.9);
}

@keyframes pop{
  0%   { transform: scale(1) rotate(0deg); opacity: 1; }
  50%  { transform: scale(1.5) rotate(15deg); opacity: 1; }
  100% { transform: scale(0) rotate(45deg); opacity: 0; }
}

.pop{
  animation: pop 0.4s forwards;
}

#toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.8);
  color:#fff;
  padding:14px 20px;
  border-radius:10px;
  opacity:0;
  transition:.3s;
  pointer-events:none;
  z-index:100;
}

#toast.show{
  opacity:1;
}

#resultModal{
  position: fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background: rgba(0,0,0,0.85);
  color:#fff;
  padding:20px;
  border-radius:10px;
  z-index:1000;
}

.ranking-wrap{
  max-width:340px;
  margin:16px auto 0;
  background:#fff;
  border-radius:14px;
  box-shadow:0 4px 14px rgba(0,0,0,0.08);
  padding:14px;
}

.tab-buttons{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab-btn{
  flex:1;
  border:none;
  border-radius:10px;
  padding:10px 0;
  font-size:15px;
  font-weight:bold;
  background:#f2f2f2;
  color:#666;
  cursor:pointer;
  transition:0.2s;
}

.tab-btn.active{
  background:#e85a5a;
  color:#fff;
  box-shadow:0 3px 10px rgba(232,90,90,0.25);
}

.tab-panel{
  display:none;
  text-align:left;
}

.tab-panel.active{
  display:block;
}

.rank-title{
  text-align:center;
  margin:6px 0 10px;
  font-size:16px;
  font-weight:bold;
}

.rank-list{
  padding:0;
  margin:0;
}

.rank-list li{
  list-style:none;
  margin:4px 0;
  padding:8px 10px;
  border-radius:8px;
  font-size:14px;
}

.empty-rank{
  background:#f2f2f2 !important;
  color:#666;
  font-weight:normal !important;
}
</style>
</head>
<body>

<h2 id="title">🍎 사과게임</h2>

<div id="mainScreen">
  <div style="margin:8px 0;">
    닉네임 :
    <input id="nicknameInput" maxlength="10" placeholder="닉네임 입력">
    <button id="saveNickBtn">저장</button>
  </div>

  <button id="startBtn">▶ 시작</button>

  <div class="ranking-wrap">
    <div class="tab-buttons">
      <button id="monthlyTabBtn" class="tab-btn active">월간 랭킹</button>
      <button id="weeklyTabBtn" class="tab-btn">주간 랭킹</button>
    </div>

    <div id="monthlyPanel" class="tab-panel active">
      <div id="monthlyRankingTitle" class="rank-title">📅 월간 랭킹</div>
      <ol id="monthlyRanking" class="rank-list"></ol>
    </div>

    <div id="weeklyPanel" class="tab-panel">
      <div id="weeklyRankingTitle" class="rank-title">📆 주간 랭킹</div>
      <ol id="weeklyRanking" class="rank-list"></ol>
    </div>
  </div>
</div>

<div id="gameScreen" class="hidden">
  <div id="info">
    <div id="score">점수: 0</div>
    <div id="timer">02:30</div>
  </div>
  <div id="board"></div>
</div>

<div id="toast"></div>

<div id="resultModal" class="hidden">
  <div id="finalScoreText"></div>
  <button id="confirmResultBtn">확인</button>
</div>

<script type="module">
/* ===================== Firebase ===================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, where, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
  getAuth, signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyCJUkB5D5Fm35Sgyd7gw9sLInL4toKArMg",
  authDomain:"applegame-32c01.firebaseapp.com",
  projectId:"applegame-32c01"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

signInAnonymously(auth)
  .then(() => {
    console.log("익명 로그인 성공");
  })
  .catch((error) => {
    console.error(error);
  });

/* ===================== 설정 ===================== */
const ROWS = 12;
const COLS = 10;
const GAME_TIME = 150;

const NUMBER_COUNTS = {
  1:14,
  2:16,
  3:17,
  4:18,
  5:19,
  6:12,
  7:10,
  8:8,
  9:6
};

/* ===================== 상태 ===================== */
let board = [];
let cells = [];
let selecting = false;
let score = 0;
let timeLeft = GAME_TIME;
let timerId = null;
let gameStarted = false;
let gameOver = true;
let startPos = null;
let endPos = null;

/* 히든모드 */
let hiddenMode = false;
let pressTimer = null;

/* ===================== DOM ===================== */
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const toastEl = document.getElementById("toast");
const mainScreen = document.getElementById("mainScreen");
const gameScreen = document.getElementById("gameScreen");
const nickInput = document.getElementById("nicknameInput");
const resultModal = document.getElementById("resultModal");
const finalScoreText = document.getElementById("finalScoreText");

const monthlyRankingTitleEl = document.getElementById("monthlyRankingTitle");
const weeklyRankingTitleEl = document.getElementById("weeklyRankingTitle");
const monthlyRankingEl = document.getElementById("monthlyRanking");
const weeklyRankingEl = document.getElementById("weeklyRanking");

const monthlyTabBtn = document.getElementById("monthlyTabBtn");
const weeklyTabBtn = document.getElementById("weeklyTabBtn");
const monthlyPanel = document.getElementById("monthlyPanel");
const weeklyPanel = document.getElementById("weeklyPanel");

/* ===================== 사운드 ===================== */
const popSound = new Audio("pop.wav");
const endSound = new Audio("end.wav");
[popSound, endSound].forEach(s => {
  s.preload = "auto";
  s.volume = 0.6;
});

/* ===================== 닉네임 ===================== */
function loadNick(){
  const n = localStorage.getItem("apple_nick");
  if(n) nickInput.value = n;
}

function saveNick(){
  const n = nickInput.value.trim();
  if(!n) return alert("닉네임 입력");
  localStorage.setItem("apple_nick", n);
}

function getNick(){
  return localStorage.getItem("apple_nick") || "";
}

document.getElementById("saveNickBtn").onclick = saveNick;
loadNick();

/* ===================== 토스트 ===================== */
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 1000);
}

/* ===================== 히든모드 ===================== */
const titleEl = document.getElementById("title");
titleEl.onpointerdown = () => {
  pressTimer = setTimeout(() => {
    if(getNick() !== "sc") return;
    hiddenMode = !hiddenMode;
    showToast(hiddenMode ? "🍏 히든모드 ON" : "🍎 히든모드 OFF");
  }, 1500);
};
titleEl.onpointerup = titleEl.onpointerleave = () => clearTimeout(pressTimer);

/* ===================== 보드 ===================== */
function initBoard(){
  const pool = [];

  for(const num in NUMBER_COUNTS){
    for(let i = 0; i < NUMBER_COUNTS[num]; i++){
      pool.push(Number(num));
    }
  }

  const totalCells = ROWS * COLS;
  if(pool.length !== totalCells){
    console.warn("숫자 개수 합이 보드 크기와 다름");
  }

  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  board = [];
  let idx = 0;

  for(let r = 0; r < ROWS; r++){
    const row = [];
    for(let c = 0; c < COLS; c++){
      row.push(pool[idx++]);
    }
    board.push(row);
  }
}

function render(){
  boardEl.innerHTML = "";
  cells = [];

  board.forEach((row, r) => {
    row.forEach((value, c) => {
      const d = document.createElement("div");
      d.className = "cell" + (value === 0 ? " empty" : "");
      d.textContent = value || "";
      d.dataset.r = r;
      d.dataset.c = c;
      boardEl.appendChild(d);
      cells.push(d);
    });
  });
}

/* ===================== 타이머 ===================== */
function startTimer(){
  clearInterval(timerId);

  timerId = setInterval(() => {
    if(!gameStarted) return;

    timeLeft--;
    timerEl.textContent =
      `${String(Math.floor(timeLeft / 60)).padStart(2, "0")}:${String(timeLeft % 60).padStart(2, "0")}`;

    if(timeLeft <= 0) endGame();
  }, 1000);
}

function clearSelection(){
  cells.forEach(c => c.classList.remove("selected"));
}

function highlightSelection(r1, r2, c1, c2){
  clearSelection();
  for(let r = r1; r <= r2; r++){
    for(let c = c1; c <= c2; c++){
      cells[r * COLS + c].classList.add("selected");
    }
  }
}

/* ===================== 선택 & 점수 ===================== */
boardEl.onpointerdown = e => {
  if(gameOver) return;

  const el = e.target;
  if(!el.classList.contains("cell")) return;

  e.preventDefault();
  boardEl.setPointerCapture(e.pointerId);

  selecting = true;
  startPos = [+el.dataset.r, +el.dataset.c];
  endPos = startPos;
};

boardEl.onpointermove = e => {
  if(!selecting) return;

  const el = document.elementFromPoint(e.clientX, e.clientY);
  if(!el || !el.classList.contains("cell")) return;

  endPos = [+el.dataset.r, +el.dataset.c];

  const r1 = Math.min(startPos[0], endPos[0]);
  const r2 = Math.max(startPos[0], endPos[0]);
  const c1 = Math.min(startPos[1], endPos[1]);
  const c2 = Math.max(startPos[1], endPos[1]);

  highlightSelection(r1, r2, c1, c2);
};

boardEl.onpointerup = e => {
  if(!selecting) return;

  selecting = false;

  try{
    boardEl.releasePointerCapture(e.pointerId);
  }catch(err){
    console.warn(err);
  }

  if(!startPos || !endPos) return;

  const r1 = Math.min(startPos[0], endPos[0]);
  const r2 = Math.max(startPos[0], endPos[0]);
  const c1 = Math.min(startPos[1], endPos[1]);
  const c2 = Math.max(startPos[1], endPos[1]);

  let sum = 0;
  let appleCount = 0;
  let pos = [];

  for(let r = r1; r <= r2; r++){
    for(let c = c1; c <= c2; c++){
      if(board[r][c] > 0){
        sum += board[r][c];
        appleCount++;
        pos.push([r, c]);
      }
    }
  }

  if(sum === 10 && appleCount >= 2){
    popSound.currentTime = 0;
    popSound.play();

    pos.forEach(([r, c]) => {
      cells[r * COLS + c].classList.add("pop");
    });

    setTimeout(() => {
      pos.forEach(([r, c]) => board[r][c] = 0);
      score += appleCount;
      scoreEl.textContent = `점수: ${score}`;
      render();
    }, 400);
  }

  startPos = null;
  endPos = null;
  clearSelection();
};

/* ===================== 날짜 키 ===================== */
function getWeek(){
  const d = new Date();
  const u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = u.getUTCDay() || 7;
  u.setUTCDate(u.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(u.getUTCFullYear(), 0, 1));
  const w = Math.ceil((((u - y) / 86400000) + 1) / 7);
  return `${u.getUTCFullYear()}-W${String(w).padStart(2, "0")}`;
}

function getMonth(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

/* ===================== 탭 ===================== */
function switchTab(type){
  if(type === "monthly"){
    monthlyTabBtn.classList.add("active");
    weeklyTabBtn.classList.remove("active");
    monthlyPanel.classList.add("active");
    weeklyPanel.classList.remove("active");
  }else{
    weeklyTabBtn.classList.add("active");
    monthlyTabBtn.classList.remove("active");
    weeklyPanel.classList.add("active");
    monthlyPanel.classList.remove("active");
  }
}

monthlyTabBtn.onclick = () => switchTab("monthly");
weeklyTabBtn.onclick = () => switchTab("weekly");

/* ===================== 랭킹 ===================== */
function applyRankStyle(li, rank){
  if(rank === 1) li.style.background = "gold";
  else if(rank === 2) li.style.background = "silver";
  else if(rank === 3) li.style.background = "#cd7f32";
  else li.style.background = "#fff3cd";

  li.style.fontWeight = rank <= 3 ? "bold" : "normal";
}

async function saveRank(score){
  await addDoc(collection(db, "ranking"), {
    name: getNick(),
    score: score,
    week: getWeek(),
    month: getMonth(),
    date: new Date()
  });
}

async function loadWeeklyRanking(){
  const w = getWeek();
  weeklyRankingTitleEl.textContent = `📆 ${w} 주간 랭킹`;
  weeklyRankingEl.innerHTML = "";

  const q = query(
    collection(db, "ranking"),
    where("week", "==", w),
    orderBy("score", "desc"),
    limit(50)
  );

  const snap = await getDocs(q);
  let i = 1;

  snap.forEach(doc => {
    const data = doc.data();
    const li = document.createElement("li");
    li.textContent = `${i}위 · ${data.name} · ${data.score}`;
    applyRankStyle(li, i);
    weeklyRankingEl.appendChild(li);
    i++;
  });

  if(i === 1){
    const li = document.createElement("li");
    li.textContent = "아직 주간 기록이 없습니다.";
    li.classList.add("empty-rank");
    weeklyRankingEl.appendChild(li);
  }
}

async function loadMonthlyRanking(){
  const m = getMonth();
  monthlyRankingTitleEl.textContent = `📅 ${m} 월간 랭킹`;
  monthlyRankingEl.innerHTML = "";

  const q = query(
    collection(db, "ranking"),
    where("month", "==", m),
    orderBy("score", "desc"),
    limit(50)
  );

  const snap = await getDocs(q);
  let i = 1;

  snap.forEach(doc => {
    const data = doc.data();
    const li = document.createElement("li");
    li.textContent = `${i}위 · ${data.name} · ${data.score}`;
    applyRankStyle(li, i);
    monthlyRankingEl.appendChild(li);
    i++;
  });

  if(i === 1){
    const li = document.createElement("li");
    li.textContent = "아직 월간 기록이 없습니다.";
    li.classList.add("empty-rank");
    monthlyRankingEl.appendChild(li);
  }
}

async function loadRanking(){
  try{
    await Promise.all([
      loadMonthlyRanking(),
      loadWeeklyRanking()
    ]);
  }catch(error){
    console.error("랭킹 로드 오류:", error);
  }
}

/* ===================== 게임 종료 ===================== */
async function endGame(){
  if(gameOver) return;

  gameOver = true;
  gameStarted = false;
  clearInterval(timerId);

  endSound.currentTime = 0;
  endSound.play();

  await saveRank(score);

  finalScoreText.textContent = `내 점수: ${score}점`;
  resultModal.classList.remove("hidden");
}

document.getElementById("confirmResultBtn").onclick = () => {
  resultModal.classList.add("hidden");
  mainScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  loadRanking();
};

/* ===================== 게임 시작 ===================== */
document.getElementById("startBtn").onclick = () => {
  if(!getNick()) return alert("닉네임 입력");

  score = 0;
  scoreEl.textContent = "점수: 0";

  timeLeft = hiddenMode ? 210 : GAME_TIME;
  timerEl.textContent =
    `${String(Math.floor(timeLeft / 60)).padStart(2, "0")}:${String(timeLeft % 60).padStart(2, "0")}`;

  gameOver = false;
  gameStarted = true;

  initBoard();
  render();

  mainScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  startTimer();
};

/* ===================== 초기 화면 ===================== */
switchTab("weekly");
loadRanking();
</script>

</body>
</html>
