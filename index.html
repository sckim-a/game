<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>사과게임</title>
<style>
body{margin:0;font-family:Arial,sans-serif;text-align:center;}
.hidden{display:none;}
#title{cursor:pointer;user-select:none;}
#info{display:flex;justify-content:center;gap:20px;margin:10px 0;font-weight:bold;}
#board{
  width:80vw;max-width:360px;margin:auto;
  display:grid;grid-template-columns:repeat(10,1fr);
  gap:4px;touch-action:none;user-select:none;
}
.cell{
  aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffe3e3,#ff4d4d);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:24px;color:#fff;
}
.cell.empty{background:#ddd;color:transparent;border-radius:6px;}
.selected{outline:3px solid #ffd43b;}
@keyframes pop{0%{transform:scale(1)}60%{transform:scale(1.3)}100%{transform:scale(0)}}
.pop{animation:pop .3s forwards;}
#toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.8);color:#fff;
  padding:14px 20px;border-radius:10px;
  opacity:0;transition:.3s;pointer-events:none;z-index:100;
}
#toast.show{opacity:1;}
#ranking{max-width:320px;margin:10px auto;text-align:left;padding:0;}
#ranking li{list-style:none;margin:4px 0;padding:6px;border-radius:6px;font-size:14px;}
.rank1{background:gold;font-weight:bold;}
.rank2{background:silver;font-weight:bold;}
.rank3{background:#cd7f32;font-weight:bold;}
.rankN{background:#fff3cd;}
#nicknameInput{width:120px;padding:6px;font-size:14px;}
#saveNickBtn{padding:6px 12px;font-size:14px;margin-left:4px;}
button{padding:6px 12px;font-size:14px;margin:4px;}
#buttonGroup button {
  width: 200px; margin: 0 auto; padding: 10px 0; font-size: 16px; border-radius: 6px;
}
#resultModal{
  position: fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background: rgba(0,0,0,0.85); color:#fff; padding:20px; border-radius:10px; z-index:1000; text-align:center;
}
</style>
</head>
<body>

<h2 id="title">🍎 사과게임</h2>

<div id="mainScreen">
  <div style="margin:8px 0;">
    닉네임 :
    <input id="nicknameInput" maxlength="10" placeholder="닉네임 입력">
    <button id="saveNickBtn">저장</button>
  </div>
  <div id="buttonGroup" style="display:flex; flex-direction:column; gap:10px; margin:10px 0; align-items:center;">
    <button id="startBtn">▶ 시작</button>
  </div>
  <h3 id="rankingTitle"></h3>
  <ol id="ranking"></ol>
</div>

<div id="gameScreen" class="hidden">
  <div id="info">
    <div id="score">점수: 0</div>
    <div id="possible">가능 조합: 0개</div>
    <div id="timer">02:00</div>
  </div>
  <div id="board"></div>
</div>

<div id="toast"></div>

<div id="resultModal" class="hidden">
  <div id="finalScoreText">점수: 0점</div>
  <button id="confirmResultBtn">확인</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, where, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig={
  apiKey:"AIzaSyCJUkB5D5Fm35Sgyd7gw9sLInL4toKArMg",
  authDomain:"applegame-32c01.firebaseapp.com",
  projectId:"applegame-32c01"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* 🔊 사운드 */
const popSound = new Audio("pop.mp3");
const endSound = new Audio("end.mp3");
[popSound, endSound].forEach(s=>{
  s.preload="auto";
  s.volume=0.6;
});

/* 설정 */
const ROWS=12, COLS=10, GAME_TIME=120;

/* 상태 */
let board=[], cells=[], visited=[];
let selecting=false, score=0, timeLeft=GAME_TIME;
let gameOver=true, gameStarted=false;
let timerId=null;

/* DOM */
const boardEl=document.getElementById("board");
const scoreEl=document.getElementById("score");
const timerEl=document.getElementById("timer");
const possibleEl=document.getElementById("possible");
const toastEl=document.getElementById("toast");
const mainScreen=document.getElementById("mainScreen");
const gameScreen=document.getElementById("gameScreen");
const rankingEl=document.getElementById("ranking");
const rankingTitleEl=document.getElementById("rankingTitle");
const nickInput=document.getElementById("nicknameInput");
const resultModal=document.getElementById("resultModal");
const finalScoreText=document.getElementById("finalScoreText");
const confirmBtn=document.getElementById("confirmResultBtn");

/* 닉네임 */
function loadNick(){
  const n=localStorage.getItem("apple_nick");
  if(n) nickInput.value=n;
}
function saveNick(){
  const n=nickInput.value.trim().slice(0,10);
  if(!n) return alert("닉네임 입력");
  localStorage.setItem("apple_nick",n);
}
function getNick(){return localStorage.getItem("apple_nick")||"";}
function requireNick(){
  if(!getNick().trim()){
    alert("닉네임을 먼저 입력해주세요!");
    nickInput.focus();
    return false;
  }
  return true;
}
document.getElementById("saveNickBtn").onclick=saveNick;
loadNick();

/* 보드 */
function initBoard(){
  board=Array.from({length:ROWS},()=>Array.from({length:COLS},
    ()=>Math.floor(Math.random()*9)+1
  ));
}
function render(){
  boardEl.innerHTML="";
  cells=[];
  board.forEach((r,i)=>r.forEach((v,j)=>{
    const d=document.createElement("div");
    d.className="cell"+(v===0?" empty":"");
    d.textContent=v||"";
    d.dataset.r=i;
    d.dataset.c=j;
    boardEl.appendChild(d);
    cells.push(d);
  }));
}

/* 타이머 */
function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!gameStarted) return;
    timeLeft--;
    timerEl.textContent=
      `${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;
    if(timeLeft<=0) endGame();
  },1000);
}

/* 선택 */
boardEl.onpointerdown=()=>{
  if(gameOver) return;
  visited=[];
  selecting=true;
};
boardEl.onpointermove=e=>{
  if(!selecting) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(!el||!el.classList.contains("cell"))return;
  const r=+el.dataset.r,c=+el.dataset.c;
  if(visited.some(v=>v[0]==r&&v[1]==c))return;
  visited.push([r,c]);
  const rs=visited.map(v=>v[0]),cs=visited.map(v=>v[1]);
  const mr=Math.min(...rs),Mr=Math.max(...rs),
        mc=Math.min(...cs),Mc=Math.max(...cs);
  cells.forEach(x=>{
    const rr=+x.dataset.r,cc=+x.dataset.c;
    x.classList.toggle("selected",
      rr>=mr&&rr<=Mr&&cc>=mc&&cc<=Mc
    );
  });
};
boardEl.onpointerup=()=>{
  selecting=false;
  if(!visited.length) return;

  const rs=visited.map(v=>v[0]),cs=visited.map(v=>v[1]);
  const mr=Math.min(...rs),Mr=Math.max(...rs),
        mc=Math.min(...cs),Mc=Math.max(...cs);

  let sum=0,pos=[];
  for(let r=mr;r<=Mr;r++)
    for(let c=mc;c<=Mc;c++){
      sum+=board[r][c];
      pos.push([r,c]);
    }

  if(sum===10 && pos.length>=2){
    popSound.currentTime=0;
    popSound.play();

    pos.forEach(([r,c])=>{
      cells[r*COLS+c].classList.add("pop");
    });

    setTimeout(()=>{
      pos.forEach(([r,c])=>board[r][c]=0);
      score+=pos.length;
      scoreEl.textContent=`점수: ${score}`;
      render();
    },300);
  }
};

/* 게임 종료 */
async function endGame(){
  if(gameOver) return;
  gameOver=true;
  gameStarted=false;
  clearInterval(timerId);

  endSound.currentTime=0;
  endSound.play();

  finalScoreText.textContent=`내 점수: ${score}점`;
  resultModal.classList.remove("hidden");
}

/* 확인 */
confirmBtn.onclick=()=>{
  resultModal.classList.add("hidden");
  mainScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
};

/* 시작 */
document.getElementById("startBtn").onclick=()=>{
  if(!requireNick()) return;

  clearInterval(timerId);
  score=0;
  scoreEl.textContent="점수: 0";
  timeLeft=GAME_TIME;
  timerEl.textContent="02:00";
  gameOver=false;
  gameStarted=true;

  initBoard();
  render();
  mainScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  startTimer();
};
</script>
</body>
</html>
