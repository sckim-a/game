<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>사과게임</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
}

.hidden { display: none; }

/* ===== 정보 ===== */
#info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 10px 0;
  font-weight: bold;
}

/* ===== 보드 ===== */
#board {
  width: 80vw;
  max-width: 360px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  touch-action: none;
  user-select: none;
}

/* ===== 🍎 사과 (나뭇잎 제거, 밝은 색) ===== */
.cell {
  aspect-ratio: 1 / 1;
  position: relative;
  background: radial-gradient(circle at 30% 30%, #ffe3e3, #ff6b6b);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: #ffffff;
  text-shadow: 0 0 3px rgba(0,0,0,0.9);
  box-shadow: inset -2px -2px 4px rgba(0,0,0,0.15),
              0 2px 4px rgba(0,0,0,0.25);
}

.cell.empty {
  background: #e0e0e0;
  border-radius: 6px;
  box-shadow: none;
  color: transparent;
}

.selected {
  outline: 3px solid #ffd43b;
}

/* ===== 터짐 ===== */
@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  60% { transform: scale(1.35); }
  100% { transform: scale(0); opacity: 0; }
}
.pop { animation: pop 0.3s ease-out forwards; }

/* ===== 랭킹 ===== */
#ranking {
  max-width: 320px;
  margin: 10px auto 20px;
  padding: 0;
  text-align: left;
}
#ranking li {
  list-style: none;
  margin: 4px 0;
  padding: 6px;
  border-radius: 6px;
  font-size: 14px;
}
.rank1 { background: gold; font-weight: bold; }
.rank2 { background: silver; font-weight: bold; }
.rank3 { background: #cd7f32; font-weight: bold; }
.rankN { background: #fff3cd; }

button {
  padding: 10px 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2>🍎 사과게임</h2>

<div id="mainScreen">
  <button id="startBtn">▶ 게임 시작</button>
  <h3 id="rankingTitle"></h3>
  <ol id="ranking"></ol>
</div>

<div id="gameScreen" class="hidden">
  <div id="info">
    <div id="score">점수: 0</div>
    <div id="timer">02:00</div>
  </div>
  <div id="board"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  query, where, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
    apiKey: "AIzaSyCJUkB5D5Fm35Sgyd7gw9sLInL4toKArMg",
    authDomain: "applegame-32c01.firebaseapp.com",
    projectId: "applegame-32c01",
    storageBucket: "applegame-32c01.firebasestorage.app",
    messagingSenderId: "471752911086",
    appId: "1:471752911086:web:6ea47c3952412fe650ebff",
    measurementId: "G-4GETLD0JGB"
 };
  
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 설정 */
const ROWS = 12;
const COLS = 10;
const GAME_TIME = 120;

/* 효과음 */
const sfxSelect = new Audio("select.wav");
const sfxPop = new Audio("pop.wav");
const sfxEnd = new Audio("end.wav");

sfxSelect.volume = 0.4;
sfxPop.volume = 0.6;
sfxEnd.volume = 0.7;

/* 상태 */
let board = [];
let cells = [];
let selecting = false;
let visited = [];
let score = 0;
let timeLeft = GAME_TIME;
let timerId = null;
let gameOver = true;

/* DOM */
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const rankingEl = document.getElementById("ranking");
const rankingTitleEl = document.getElementById("rankingTitle");
const mainScreen = document.getElementById("mainScreen");
const gameScreen = document.getElementById("gameScreen");

/* 월 */
function getCurrentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function updateRankingTitle(m) {
  const [y, mo] = m.split("-");
  rankingTitleEl.textContent = `📅 ${y}년 ${Number(mo)}월 랭킹 TOP 30`;
}

/* 화면 */
function showMain() {
  mainScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  loadRanking();
}
function showGame() {
  mainScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
}

/* 보드 */
function initBoard() {
  board = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => Math.floor(Math.random() * 9) + 1)
  );
}
function render() {
  boardEl.innerHTML = "";
  cells = [];
  board.forEach((row, r) => {
    row.forEach((v, c) => {
      const d = document.createElement("div");
      d.className = "cell" + (v === 0 ? " empty" : "");
      d.textContent = v || "";
      d.dataset.r = r;
      d.dataset.c = c;
      boardEl.appendChild(d);
      cells.push(d);
    });
  });
}

/* 타이머 */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) endGame();
  }, 1000);
}
function updateTimer() {
  timerEl.textContent =
    `${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;
}

/* 랭킹 */
async function saveOnline(name, score) {
  await addDoc(collection(db,"ranking"), {
    name, score,
    month: getCurrentMonth(),
    date: new Date()
  });
}
async function loadRanking() {
  const m = getCurrentMonth();
  updateRankingTitle(m);
  const q = query(
    collection(db,"ranking"),
    where("month","==",m),
    orderBy("score","desc"),
    limit(30)
  );
  const snap = await getDocs(q);
  rankingEl.innerHTML="";
  let rank=1;
  snap.forEach(doc=>{
    const d=doc.data();
    const li=document.createElement("li");
    li.className = rank===1?"rank1":rank===2?"rank2":rank===3?"rank3":"rankN";
    li.textContent=`${rank}위 · ${d.name} · ${d.score}점`;
    rankingEl.appendChild(li);
    rank++;
  });
}

/* 셀 찾기 */
function getCell(e) {
  const p = e.touches ? e.touches[0] : e;
  const el = document.elementFromPoint(p.clientX, p.clientY);
  if (!el || !el.classList.contains("cell")) return null;
  return el;
}

/* 드래그 */
boardEl.onpointerdown = e => {
  if (gameOver) return;
  boardEl.setPointerCapture(e.pointerId);
  visited = [];
  selecting = true;
};

boardEl.onpointermove = e => {
  if (!selecting) return;
  const c = getCell(e);
  if (!c) return;

  const r = +c.dataset.r;
  const col = +c.dataset.c;

  // 중복 방지
  if (visited.some(v => v[0] === r && v[1] === col)) return;

  visited.push([r, col]);

  sfxSelect.currentTime = 0;
  sfxSelect.play();

  const rows = visited.map(v=>v[0]);
  const cols = visited.map(v=>v[1]);
  const minR=Math.min(...rows), maxR=Math.max(...rows);
  const minC=Math.min(...cols), maxC=Math.max(...cols);

  cells.forEach(x=>{
    const rr=+x.dataset.r, cc=+x.dataset.c;
    x.classList.toggle("selected",
      rr>=minR && rr<=maxR && cc>=minC && cc<=maxC
    );
  });
};

boardEl.onpointerup = () => {
  if (!selecting) return;
  selecting=false;

  const rows = visited.map(v=>v[0]);
  const cols = visited.map(v=>v[1]);
  if (!rows.length) return;

  const minR=Math.min(...rows), maxR=Math.max(...rows);
  const minC=Math.min(...cols), maxC=Math.max(...cols);

  let sum=0, pos=[];
  for(let r=minR;r<=maxR;r++)
    for(let c=minC;c<=maxC;c++)
      if(board[r][c]>0){ sum+=board[r][c]; pos.push([r,c]); }

  if(sum===10 && pos.length>=2){
    sfxPop.currentTime = 0;
    sfxPop.play();
  
    pos.forEach(([r,c])=>cells[r*COLS+c].classList.add("pop"));
    setTimeout(()=>{
      pos.forEach(([r,c])=>board[r][c]=0);
      score+=pos.length;
      scoreEl.textContent=`점수: ${score}`;
      render();
    },300);
  }
};

/* 종료 */
async function endGame() {
  gameOver = true;
  clearInterval(timerId);

  sfxEnd.currentTime = 0;
  sfxEnd.play();

  const name = prompt("닉네임 입력") || "PLAYER";
  await saveOnline(name.slice(0,10), score);
  showMain();
}

/* 시작 */
document.getElementById("startBtn").onclick = () => {
  score=0;
  timeLeft=GAME_TIME;
  gameOver=false;
  scoreEl.textContent="점수: 0";
  updateTimer();
  initBoard();
  render();
  showGame();
  startTimer();
};

showMain();
</script>
</body>
</html>
