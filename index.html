<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>사과게임</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
}
.hidden { display:none; }

#title {
  cursor: pointer;
  user-select: none;
}

#info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 10px 0;
  font-weight: bold;
}

#board {
  width: 80vw;
  max-width: 360px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  touch-action: none;
  user-select: none;
}

.cell {
  aspect-ratio: 1/1;
  background: radial-gradient(circle at 30% 30%, #ffe3e3, #ff4d4d);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: #fff;
  text-shadow: 0 0 3px rgba(0,0,0,0.8);
}
.cell.empty {
  background: #ddd;
  color: transparent;
  border-radius: 6px;
}

.selected { outline: 3px solid #ffd43b; }

@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  60% { transform: scale(1.35); }
  100% { transform: scale(0); opacity: 0; }
}
.pop { animation: pop 0.3s ease-out forwards; }

#toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 14px 20px;
  border-radius: 10px;
  font-weight: bold;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 100;
}
#toast.show { opacity: 1; }

#ranking {
  max-width: 320px;
  margin: 10px auto 20px;
  padding: 0;
  text-align: left;
}
#ranking li {
  list-style: none;
  margin: 4px 0;
  padding: 6px;
  border-radius: 6px;
  font-size: 14px;
}
.rank1 { background: gold; font-weight: bold; }
.rank2 { background: silver; font-weight: bold; }
.rank3 { background: #cd7f32; font-weight: bold; }
.rankN { background: #fff3cd; }

button {
  padding: 10px 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2 id="title">🍎 사과게임</h2>

<div id="mainScreen">
  <button id="startBtn">▶ 시작</button>
  <h3 id="rankingTitle"></h3>
  <ol id="ranking"></ol>
</div>

<div id="gameScreen" class="hidden">
  <div id="info">
    <div id="score">점수: 0</div>
    <div id="possible"></div>
    <div id="timer">02:00</div>
  </div>
  <div id="board"></div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  query, where, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyCJUkB5D5Fm35Sgyd7gw9sLInL4toKArMg",
  authDomain: "applegame-32c01.firebaseapp.com",
  projectId: "applegame-32c01"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 설정 */
const ROWS = 12;
const COLS = 10;
const GAME_TIME = 120;
const FIVE_TIME = 200; // ⭐ 롱프레스 히든 모드

/* 상태 */
let board = [];
let cells = [];
let visited = [];
let selecting = false;
let score = 0;
let timeLeft = GAME_TIME;
let timerId = null;
let gameOver = true;

/* DOM */
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const possibleEl = document.getElementById("possible");
const toastEl = document.getElementById("toast");
const mainScreen = document.getElementById("mainScreen");
const gameScreen = document.getElementById("gameScreen");
const rankingEl = document.getElementById("ranking");
const rankingTitleEl = document.getElementById("rankingTitle");

/* 토스트 */
function showToast(msg, duration=1000){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), duration);
}

/* ISO 주간 */
function getCurrentWeek() {
  const d = new Date();
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getUTCFullYear()}-W${String(week).padStart(2,"0")}`;
}

function updateRankingTitle(w){
  const [y, wk] = w.split("-W");
  rankingTitleEl.textContent = `📅 ${y}년 ${wk}주차 랭킹 TOP 30`;
}

/* 화면 */
function showMain(){
  mainScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  loadRanking();
}
function showGame(){
  mainScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
}

/* 보드 */
function initBoard(){
  board = Array.from({length:ROWS},()=> 
    Array.from({length:COLS},()=>Math.floor(Math.random()*9)+1)
  );
}
function render(){
  boardEl.innerHTML="";
  cells=[];
  board.forEach((row,r)=>{
    row.forEach((v,c)=>{
      const d=document.createElement("div");
      d.className="cell"+(v===0?" empty":"");
      d.textContent=v||"";
      d.dataset.r=r;
      d.dataset.c=c;
      boardEl.appendChild(d);
      cells.push(d);
    });
  });
  updatePossible();
}

/* 타이머 */
function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft--;
    timerEl.textContent =
      `${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;
    if(timeLeft<=0) endGame();
  },1000);
}

/* 랭킹 */
async function saveOnline(name,score){
  await addDoc(collection(db,"ranking"),{
    name, score,
    week: getCurrentWeek(),
    date: new Date()
  });
}
async function loadRanking(){
  const w=getCurrentWeek();
  updateRankingTitle(w);
  const q=query(
    collection(db,"ranking"),
    where("week","==",w),
    orderBy("score","desc"),
    limit(30)
  );
  const snap=await getDocs(q);
  rankingEl.innerHTML="";
  let rank=1;
  snap.forEach(doc=>{
    const d=doc.data();
    const li=document.createElement("li");
    li.className=rank<=3?`rank${rank}`:"rankN";
    li.textContent=`${rank}위 · ${d.name} · ${d.score}점`;
    rankingEl.appendChild(li);
    rank++;
  });
}

/* 10 조합 계산 (개선 버전) */
function countMakeTen() {
  let count = 0;
  const sumP = Array.from({length:ROWS+1},()=>Array(COLS+1).fill(0));
  const zeroP = Array.from({length:ROWS+1},()=>Array(COLS+1).fill(0));

  for(let r=1;r<=ROWS;r++){
    for(let c=1;c<=COLS;c++){
      const v = board[r-1][c-1];
      sumP[r][c]=sumP[r-1][c]+sumP[r][c-1]-sumP[r-1][c-1]+v;
      zeroP[r][c]=zeroP[r-1][c]+zeroP[r][c-1]-zeroP[r-1][c-1]+(v===0?1:0);
    }
  }

  for(let r1=0;r1<ROWS;r1++){
    for(let c1=0;c1<COLS;c1++){
      for(let r2=r1;r2<ROWS;r2++){
        for(let c2=c1;c2<COLS;c2++){
          const cellCnt=(r2-r1+1)*(c2-c1+1);
          if(cellCnt<2) continue;

          const sum =
            sumP[r2+1][c2+1]-sumP[r1][c2+1]-sumP[r2+1][c1]+sumP[r1][c1];
          if(sum!==10) continue;

          const zero =
            zeroP[r2+1][c2+1]-zeroP[r1][c2+1]-zeroP[r2+1][c1]+zeroP[r1][c1];
          if(zero===0) count++;
        }
      }
    }
  }
  return count;
}

function updatePossible(){
  possibleEl.textContent=`가능 조합: ${countMakeTen()}개`;
}

/* 선택 */
boardEl.onpointerdown=()=>{
  if(gameOver) return;
  visited=[];
  selecting=true;
};
boardEl.onpointermove=e=>{
  if(!selecting) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(!el||!el.classList.contains("cell")) return;
  const r=+el.dataset.r,c=+el.dataset.c;
  if(visited.some(v=>v[0]===r&&v[1]===c)) return;
  visited.push([r,c]);

  const rs=visited.map(v=>v[0]);
  const cs=visited.map(v=>v[1]);
  const minR=Math.min(...rs),maxR=Math.max(...rs);
  const minC=Math.min(...cs),maxC=Math.max(...cs);

  cells.forEach(x=>{
    const rr=+x.dataset.r,cc=+x.dataset.c;
    x.classList.toggle("selected",
      rr>=minR&&rr<=maxR&&cc>=minC&&cc<=maxC);
  });
};
boardEl.onpointerup=()=>{
  selecting=false;
  if(!visited.length) return;

  const rs=visited.map(v=>v[0]);
  const cs=visited.map(v=>v[1]);
  const minR=Math.min(...rs),maxR=Math.max(...rs);
  const minC=Math.min(...cs),maxC=Math.max(...cs);

  let sum=0,pos=[];
  for(let r=minR;r<=maxR;r++)
    for(let c=minC;c<=maxC;c++)
      if(board[r][c]>0){ sum+=board[r][c]; pos.push([r,c]); }

  if(sum===10 && pos.length>=2){
    pos.forEach(([r,c])=>cells[r*COLS+c].classList.add("pop"));
    setTimeout(()=>{
      pos.forEach(([r,c])=>board[r][c]=0);
      score+=pos.length;
      scoreEl.textContent=`점수: ${score}`;
      render();
    },300);
  }
};

/* 종료 */
async function endGame(){
  if(gameOver) return;
  gameOver=true;
  clearInterval(timerId);
  const name=prompt("닉네임 입력")||"PLAYER";
  await saveOnline(name.slice(0,10),score);
  showMain();
}

/* 시작 버튼 (120초) */
document.getElementById("startBtn").onclick=()=>{
  score=0;
  timeLeft=GAME_TIME;
  gameOver=false;
  scoreEl.textContent="점수: 0";
  initBoard();
  render();
  showGame();
  startTimer();
};

/* 🍎 타이틀 롱프레스 (200초) */
const titleEl = document.getElementById("title");
let longPressTimer = null;

function startLongPress(){
  longPressTimer = setTimeout(()=>{
    score=0;
    timeLeft=FIVE_TIME;
    gameOver=false;
    scoreEl.textContent="점수: 0";
    initBoard();
    render();
    showGame();
    startTimer();
    showToast("🍏 200초 히든 모드 시작!",1200);
  },600); // 600ms 이상
}
function cancelLongPress(){
  clearTimeout(longPressTimer);
  longPressTimer=null;
}

titleEl.addEventListener("pointerdown", startLongPress);
titleEl.addEventListener("pointerup", cancelLongPress);
titleEl.addEventListener("pointerleave", cancelLongPress);
titleEl.addEventListener("pointercancel", cancelLongPress);

showMain();
</script>
</body>
</html>
