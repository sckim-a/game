<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍎 사과게임</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
}

.hidden { display: none; }

/* ===== 정보 ===== */
#info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 10px 0;
  font-weight: bold;
}

/* ===== 보드 ===== */
#board {
  width: 80vw;
  max-width: 360px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  touch-action: none;
  user-select: none;
}

/* ===== 사과 ===== */
.cell {
  aspect-ratio: 1 / 1;
  background: radial-gradient(circle at 30% 30%, #ffe3e3, #ff6b6b);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: white;
  box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2),
              0 2px 4px rgba(0,0,0,0.3);
}

.cell.empty {
  background: #e0e0e0;
  border-radius: 6px;
  color: transparent;
}

.selected {
  outline: 3px solid #ffd43b;
  filter: brightness(1.15);
}

/* ===== 터짐 ===== */
@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  60% { transform: scale(1.35); }
  100% { transform: scale(0); opacity: 0; }
}
.pop {
  animation: pop 0.3s ease-out forwards;
}

/* ===== 랭킹 ===== */
#ranking {
  max-width: 320px;
  margin: 10px auto 20px;
  padding: 0;
  text-align: left;
}
#ranking li {
  list-style: none;
  margin: 4px 0;
  padding: 6px;
  border-radius: 6px;
  font-size: 14px;
}
.rank1 { background: gold; font-weight: bold; }
.rank2 { background: silver; font-weight: bold; }
.rank3 { background: #cd7f32; font-weight: bold; }
.rankN { background: #fff3cd; }

button {
  padding: 10px 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2 id="logo">🍎 사과게임</h2>

<div id="mainScreen">
  <button id="startBtn">▶ 일반모드 시작</button>
  <p>🍎 아이콘 클릭 → 무제한모드</p>
  <h3 id="rankingTitle"></h3>
  <ol id="ranking"></ol>
</div>

<div id="gameScreen" class="hidden">
  <div id="info">
    <div id="score">점수: 0</div>
    <div id="timer"></div>
  </div>
  <div id="board"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  query, where, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyCJUkB5D5Fm35Sgyd7gw9sLInL4toKArMg",
  authDomain: "applegame-32c01.firebaseapp.com",
  projectId: "applegame-32c01"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 설정 */
const ROWS = 12;
const COLS = 10;
const GAME_TIME = 120;

/* 효과음 */
const sfxPop = new Audio("pop.wav");
const sfxEnd = new Audio("end.wav");
sfxPop.volume = 0.6;
sfxEnd.volume = 0.7;

/* 상태 */
let board = [];
let cells = [];
let visited = [];
let selecting = false;
let score = 0;
let timeLeft = GAME_TIME;
let timerId = null;
let gameOver = true;
let infiniteMode = false;

/* DOM */
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const rankingEl = document.getElementById("ranking");
const rankingTitleEl = document.getElementById("rankingTitle");
const mainScreen = document.getElementById("mainScreen");
const gameScreen = document.getElementById("gameScreen");

/* 월 */
function getCurrentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function updateRankingTitle() {
  const [y, m] = getCurrentMonth().split("-");
  rankingTitleEl.textContent = `📅 ${y}년 ${Number(m)}월 랭킹`;
}

/* 화면 */
function showMain() {
  mainScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  loadRanking();
}
function showGame() {
  mainScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
}

/* 보드 */
function initBoard() {
  board = Array.from({length:ROWS},
    ()=>Array.from({length:COLS},()=>Math.floor(Math.random()*9)+1)
  );
}
function render() {
  boardEl.innerHTML="";
  cells=[];
  board.forEach((row,r)=>{
    row.forEach((v,c)=>{
      const d=document.createElement("div");
      d.className="cell"+(v===0?" empty":"");
      d.textContent=v||"";
      d.dataset.r=r;
      d.dataset.c=c;
      boardEl.appendChild(d);
      cells.push(d);
    });
  });
}

/* 타이머 */
function startTimer() {
  if(infiniteMode){
    timerEl.textContent="∞";
    return;
  }
  clearInterval(timerId);
  timerEl.textContent="02:00";
  timerId=setInterval(()=>{
    timeLeft--;
    timerEl.textContent=
      `${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;
    if(timeLeft<=0) endGame();
  },1000);
}

/* 랭킹 */
async function saveOnline(name,score,mode){
  await addDoc(collection(db,"ranking"),{
    name, score, mode,
    month:getCurrentMonth(),
    date:new Date()
  });
}
async function loadRanking(){
  updateRankingTitle();
  const q=query(
    collection(db,"ranking"),
    where("month","==",getCurrentMonth()),
    orderBy("score","desc"),
    limit(30)
  );
  const snap=await getDocs(q);
  rankingEl.innerHTML="";
  let rank=1;
  snap.forEach(doc=>{
    const d=doc.data();
    const li=document.createElement("li");
    li.className=rank===1?"rank1":rank===2?"rank2":rank===3?"rank3":"rankN";
    li.textContent=`${rank}위 · ${d.name} · ${d.score}점 (${d.mode})`;
    rankingEl.appendChild(li);
    rank++;
  });
}

/* 드래그 선택 */
boardEl.onpointerdown = e => {
  if(gameOver) return;
  selecting = true;
  visited = [];

  const el = document.elementFromPoint(e.clientX,e.clientY);
  if(!el || !el.classList.contains("cell")) return;

  visited.push([+el.dataset.r,+el.dataset.c]);
};

boardEl.onpointermove = e => {
  if(!selecting) return;

  const el = document.elementFromPoint(e.clientX,e.clientY);
  if(!el || !el.classList.contains("cell")) return;

  const r=+el.dataset.r,c=+el.dataset.c;
  if(visited.some(v=>v[0]===r&&v[1]===c)) return;
  visited.push([r,c]);

  const rs=visited.map(v=>v[0]),cs=visited.map(v=>v[1]);
  const minR=Math.min(...rs),maxR=Math.max(...rs);
  const minC=Math.min(...cs),maxC=Math.max(...cs);

  cells.forEach(cell=>{
    const rr=+cell.dataset.r,cc=+cell.dataset.c;
    cell.classList.toggle(
      "selected",
      rr>=minR&&rr<=maxR&&cc>=minC&&cc<=maxC
    );
  });
};

boardEl.onpointerup = () => {
  selecting=false;
  cells.forEach(c=>c.classList.remove("selected"));
  if(!visited.length) return;

  const rs=visited.map(v=>v[0]),cs=visited.map(v=>v[1]);
  const minR=Math.min(...rs),maxR=Math.max(...rs);
  const minC=Math.min(...cs),maxC=Math.max(...cs);

  let sum=0,pos=[];
  for(let r=minR;r<=maxR;r++)
    for(let c=minC;c<=maxC;c++)
      if(board[r][c]>0){ sum+=board[r][c]; pos.push([r,c]); }

  if(sum===10 && pos.length>=2){
    sfxPop.currentTime=0;
    sfxPop.play();
    pos.forEach(([r,c])=>cells[r*COLS+c].classList.add("pop"));
    setTimeout(()=>{
      pos.forEach(([r,c])=>board[r][c]=0);
      score+=pos.length;
      scoreEl.textContent=`점수: ${score}`;
      render();
    },300);
  }
};

/* 종료 */
async function endGame(){
  gameOver=true;
  clearInterval(timerId);
  sfxEnd.play();
  const name=prompt("닉네임 입력")||"PLAYER";
  await saveOnline(name.slice(0,10),score,infiniteMode?"무제한":"일반");
  showMain();
}

/* 시작 */
function startGame(inf){
  infiniteMode=inf;
  gameOver=false;
  score=0;
  timeLeft=GAME_TIME;
  scoreEl.textContent="점수: 0";
  initBoard();
  render();
  showGame();
  startTimer();
}

document.getElementById("startBtn").onclick=()=>startGame(false);
document.getElementById("logo").onclick=()=>startGame(true);

showMain();
</script>
</body>
</html>
