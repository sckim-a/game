<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>사과게임</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
}

.hidden { display: none; }

/* ===== 정보 ===== */
#info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 10px 0;
  font-weight: bold;
}

/* ===== 보드 ===== */
#board {
  width: 80vw;
  max-width: 360px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  touch-action: none;
  user-select: none;
}

/* ===== 🍎 사과 타일 (밝은 색) ===== */
.cell {
  aspect-ratio: 1 / 1;
  position: relative;
  background: radial-gradient(
    circle at 30% 30%,
    #ffd6d6,
    #ff6b6b
  );
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: #ffffff;
  text-shadow:
    0 0 3px rgba(0,0,0,0.9),
    1px 1px 2px rgba(0,0,0,0.8);
  box-shadow:
    inset -2px -2px 4px rgba(0,0,0,0.15),
    0 2px 4px rgba(0,0,0,0.25);
}

.cell::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 6px;
  background: #2f9e44;
  border-radius: 50%;
  top: 5px;
  right: 8px;
}

/* 빈칸 */
.cell.empty {
  background: #e0e0e0;
  border-radius: 6px;
  box-shadow: none;
  color: transparent;
  text-shadow: none;
}

.selected {
  outline: 3px solid #ffd43b;
}

/* ===== 🍎 터짐 ===== */
@keyframes pop {
  0%   { transform: scale(1); opacity: 1; }
  60%  { transform: scale(1.35); }
  100% { transform: scale(0); opacity: 0; }
}

.pop {
  animation: pop 0.3s ease-out forwards;
}

/* ===== 랭킹 ===== */
#ranking {
  max-width: 320px;
  margin: 10px auto 20px;
  padding: 0;
  text-align: left;
}

#ranking li {
  list-style: none;
  margin: 4px 0;
  padding: 6px;
  border-radius: 6px;
  font-size: 14px;
}

.rank1 { background: gold; font-weight: bold; }
.rank2 { background: silver; font-weight: bold; }
.rank3 { background: #cd7f32; font-weight: bold; }
.rankN { background: #fff3cd; }

button {
  padding: 10px 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2>🍎 사과게임</h2>

<!-- ===== 메인 ===== -->
<div id="mainScreen">
  <button id="startBtn">▶ 게임 시작</button>
  <h3 id="rankingTitle"></h3>
  <ol id="ranking"></ol>
</div>

<!-- ===== 게임 ===== -->
<div id="gameScreen" class="hidden">
  <div id="info">
    <div id="score">점수: 0</div>
    <div id="timer">02:00</div>
  </div>
  <div id="board"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  query, where, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 Firebase 설정 */
const firebaseConfig = {
    apiKey: "AIzaSyCJUkB5D5Fm35Sgyd7gw9sLInL4toKArMg",
    authDomain: "applegame-32c01.firebaseapp.com",
    projectId: "applegame-32c01",
    storageBucket: "applegame-32c01.firebasestorage.app",
    messagingSenderId: "471752911086",
    appId: "1:471752911086:web:6ea47c3952412fe650ebff",
    measurementId: "G-4GETLD0JGB"
  };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== 설정 ===== */
const ROWS = 12;
const COLS = 10;
const GAME_TIME = 120;

/* ===== 상태 ===== */
let board = [];
let cells = [];
let startCell = null;
let selecting = false;
let score = 0;
let timeLeft = GAME_TIME;
let timerId = null;
let gameOver = true;

/* ===== DOM ===== */
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const rankingEl = document.getElementById("ranking");
const rankingTitleEl = document.getElementById("rankingTitle");
const mainScreen = document.getElementById("mainScreen");
const gameScreen = document.getElementById("gameScreen");

/* ===== 월 ===== */
function getCurrentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

function updateRankingTitle(m) {
  const [y, mo] = m.split("-");
  rankingTitleEl.textContent = `📅 ${y}년 ${Number(mo)}월 랭킹 TOP 30`;
}

/* ===== 화면 ===== */
function showMain() {
  mainScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  loadRanking();
}

function showGame() {
  mainScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
}

/* ===== 보드 ===== */
function initBoard() {
  board = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => Math.floor(Math.random() * 9) + 1)
  );
}

function render() {
  boardEl.innerHTML = "";
  cells = [];

  board.forEach((row, r) => {
    row.forEach((v, c) => {
      const d = document.createElement("div");
      d.className = "cell" + (v === 0 ? " empty" : "");
      d.textContent = v || "";
      d.dataset.r = r;
      d.dataset.c = c;
      boardEl.appendChild(d);
      cells.push(d);
    });
  });
}

/* ===== 타이머 ===== */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function updateTimer() {
  timerEl.textContent =
    `${String(Math.floor(timeLeft / 60)).padStart(2,"0")}:${String(timeLeft % 60).padStart(2,"0")}`;
}

/* ===== Firebase ===== */
async function saveOnline(name, score) {
  await addDoc(collection(db, "ranking"), {
    name,
    score,
    month: getCurrentMonth(),
    date: new Date()
  });
}

async function loadRanking() {
  const month = getCurrentMonth();
  updateRankingTitle(month);

  const q = query(
    collection(db, "ranking"),
    where("month", "==", month),
    orderBy("score", "desc"),
    limit(30)
  );

  const snap = await getDocs(q);
  rankingEl.innerHTML = "";

  let rank = 1;
  snap.forEach(doc => {
    const d = doc.data();
    const li = document.createElement("li");
    li.className =
      rank === 1 ? "rank1" :
      rank === 2 ? "rank2" :
      rank === 3 ? "rank3" : "rankN";
    li.textContent = `${rank}위 · ${d.name} · ${d.score}점`;
    rankingEl.appendChild(li);
    rank++;
  });
}

/* ===== 셀 인식 (모바일 정확) ===== */
function getCell(e) {
  const p = e.touches ? e.touches[0] : e;
  const el = document.elementFromPoint(p.clientX, p.clientY);
  if (!el || !el.classList.contains("cell")) return null;
  return el;
}

/* ===== 합 계산 ===== */
function rectSum(a,b) {
  let s=0,p=[];
  for(let r=Math.min(a.r,b.r);r<=Math.max(a.r,b.r);r++)
    for(let c=Math.min(a.c,b.c);c<=Math.max(a.c,b.c);c++)
      if(board[r][c]>0){s+=board[r][c];p.push([r,c]);}
  return {s,p};
}

/* ===== 드래그 ===== */
boardEl.onpointerdown = e => {
  if(gameOver) return;
  boardEl.setPointerCapture(e.pointerId);
  startCell = getCell(e);
  selecting = !!startCell;
};

boardEl.onpointermove = e => {
  if(!selecting) return;
  const c = getCell(e);
  if(!c) return;
  cells.forEach(x=>x.classList.remove("selected"));
  const a={r:+startCell.dataset.r,c:+startCell.dataset.c};
  const b={r:+c.dataset.r,c:+c.dataset.c};
  cells.forEach(x=>{
    const r=+x.dataset.r, cc=+x.dataset.c;
    if(r>=Math.min(a.r,b.r)&&r<=Math.max(a.r,b.r)
    &&cc>=Math.min(a.c,b.c)&&cc<=Math.max(a.c,b.c))
      x.classList.add("selected");
  });
};

boardEl.onpointerup = e => {
  if(!selecting) return;
  selecting=false;
  const c=getCell(e);
  if(!c) return;
  const a={r:+startCell.dataset.r,c:+startCell.dataset.c};
  const b={r:+c.dataset.r,c:+c.dataset.c};
  const {s,p}=rectSum(a,b);

  if(s===10 && p.length>=2){
    p.forEach(([r,c])=>{
      cells[r*COLS+c].classList.add("pop");
    });
    setTimeout(()=>{
      p.forEach(([r,c])=>board[r][c]=0);
      score+=p.length;
      scoreEl.textContent=`점수: ${score}`;
      render();
    },300);
  }
};

/* ===== 종료 ===== */
async function endGame() {
  gameOver = true;
  clearInterval(timerId);
  const name = prompt("닉네임 입력") || "PLAYER";
  await saveOnline(name.slice(0,10), score);
  showMain();
}

/* ===== 시작 ===== */
document.getElementById("startBtn").onclick = () => {
  score=0;
  timeLeft=GAME_TIME;
  gameOver=false;
  scoreEl.textContent="점수: 0";
  updateTimer();
  initBoard();
  render();
  showGame();
  startTimer();
};

showMain();
</script>
</body>
</html>
