<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사과게임</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h1 {
    margin-top: 10px;
  }

  #info {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 8px;
  }

  #board {
    width: 95vw;
    max-width: 420px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 2px;
    touch-action: none;
    user-select: none;
  }

  .cell {
    aspect-ratio: 1 / 1;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
  }

  .selected {
    background: #ffb347;
  }

  .empty {
    background: #ddd;
  }

  button {
    margin: 10px;
    padding: 6px 14px;
    font-size: 14px;
  }

  #ranking {
    max-width: 320px;
    margin: 10px auto 20px;
    padding: 0;
    text-align: left;
  }

  #ranking li {
    list-style: none;
    background: #fff3cd;
    margin: 4px 0;
    padding: 6px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 14px;
  }
</style>
</head>

<body>

<h1>🍎 사과게임</h1>

<div id="info">
  <div id="score">점수: 0</div>
  <div id="timer">02:00</div>
</div>

<button id="startBtn">▶ 시작</button>

<div id="board"></div>

<h3>🥇 최고 점수 랭킹 TOP 10</h3>
<ol id="ranking"></ol>

<script>
/* ===== 설정 ===== */
const ROWS = 15;
const COLS = 10;
const GAME_TIME = 120;

/* ===== 상태 ===== */
let board = [];
let cells = [];
let startCell = null;
let selecting = false;
let score = 0;
let timeLeft = GAME_TIME;
let timerId = null;
let gameOver = true;

/* ===== DOM ===== */
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const startBtn = document.getElementById("startBtn");
const rankingEl = document.getElementById("ranking");

/* ===== 보드 ===== */
function initBoard() {
  board = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => Math.floor(Math.random() * 9) + 1)
  );
}

function render() {
  boardEl.innerHTML = "";
  cells = [];

  board.forEach((row, r) => {
    row.forEach((val, c) => {
      const div = document.createElement("div");
      div.className = "cell" + (val === 0 ? " empty" : "");
      div.textContent = val === 0 ? "" : val;
      div.dataset.r = r;
      div.dataset.c = c;
      boardEl.appendChild(div);
      cells.push(div);
    });
  });
}

/* ===== 타이머 ===== */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) endGame("⏰ 시간 종료");
  }, 1000);
}

function updateTimer() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
  const s = String(timeLeft % 60).padStart(2, "0");
  timerEl.textContent = `${m}:${s}`;
}

/* ===== 랭킹 ===== */
function loadRanking() {
  const data = JSON.parse(localStorage.getItem("appleRanking") || "[]");
  rankingEl.innerHTML = "";

  data.forEach((item, idx) => {
    const li = document.createElement("li");
    li.textContent = `${idx + 1}위 · ${item.name} · ${item.score}점 (${item.date})`;
    rankingEl.appendChild(li);
  });
}

function saveRanking(score) {
  let name = prompt("닉네임을 입력하세요 (최대 10자)") || "PLAYER";
  name = name.trim().slice(0, 10);
  if (!name) name = "PLAYER";

  let data = JSON.parse(localStorage.getItem("appleRanking") || "[]");

  data.push({
    name,
    score,
    date: new Date().toLocaleDateString()
  });

  data.sort((a, b) => b.score - a.score);
  data = data.slice(0, 10);

  localStorage.setItem("appleRanking", JSON.stringify(data));
  loadRanking();
}

/* ===== 유틸 ===== */
function clearSelection() {
  cells.forEach(c => c.classList.remove("selected"));
}

function getRect(r1, c1, r2, c2) {
  let sum = 0;
  let pos = [];

  for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) {
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) {
      if (board[r][c] > 0) {
        sum += board[r][c];
        pos.push([r, c]);
      }
    }
  }
  return { sum, pos };
}

/* ===== Pointer 이벤트 ===== */
function getCellFromPointer(e) {
  const rect = boardEl.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const c = Math.floor(x / (rect.width / COLS));
  const r = Math.floor(y / (rect.height / ROWS));

  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  return cells[r * COLS + c];
}

function pointerDown(e) {
  if (gameOver) return;
  const cell = getCellFromPointer(e);
  if (!cell) return;
  startCell = cell;
  selecting = true;
  clearSelection();
}

function pointerMove(e) {
  if (!selecting) return;
  const cell = getCellFromPointer(e);
  if (!cell) return;

  clearSelection();

  const r1 = +startCell.dataset.r;
  const c1 = +startCell.dataset.c;
  const r2 = +cell.dataset.r;
  const c2 = +cell.dataset.c;

  cells.forEach(c => {
    const r = +c.dataset.r;
    const col = +c.dataset.c;
    if (
      r >= Math.min(r1, r2) && r <= Math.max(r1, r2) &&
      col >= Math.min(c1, c2) && col <= Math.max(c1, c2)
    ) c.classList.add("selected");
  });
}

function pointerUp(e) {
  if (!selecting) return;
  selecting = false;

  const cell = getCellFromPointer(e);
  if (!cell) return;

  const r1 = +startCell.dataset.r;
  const c1 = +startCell.dataset.c;
  const r2 = +cell.dataset.r;
  const c2 = +cell.dataset.c;

  const { sum, pos } = getRect(r1, c1, r2, c2);

  if (sum === 10 && pos.length >= 2) {
    pos.forEach(([r, c]) => board[r][c] = 0);
    score += pos.length;
    scoreEl.textContent = `점수: ${score}`;
    render();
  } else {
    clearSelection();
  }
}

/* ===== 이벤트 ===== */
boardEl.addEventListener("pointerdown", pointerDown);
boardEl.addEventListener("pointermove", pointerMove);
boardEl.addEventListener("pointerup", pointerUp);
boardEl.addEventListener("pointercancel", pointerUp);

/* ===== 게임 ===== */
function endGame(msg) {
  gameOver = true;
  clearInterval(timerId);
  alert(msg);
  saveRanking(score);
}

startBtn.onclick = () => {
  score = 0;
  timeLeft = GAME_TIME;
  gameOver = false;
  scoreEl.textContent = "점수: 0";
  updateTimer();
  initBoard();
  render();
  startTimer();
};

loadRanking();
</script>

</body>
</html>
